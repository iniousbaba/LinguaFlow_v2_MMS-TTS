<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaFlow - Real-time Translation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1929 0%, #1a2942 50%, #2d4263 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #e0e7ff;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(13, 27, 42, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 3em;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1.1em;
        }

        .main-card {
            background: rgba(13, 27, 42, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(96, 165, 250, 0.2);
        }

        .language-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .select-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-weight: 600;
            color: #cbd5e1;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select {
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid rgba(96, 165, 250, 0.3);
            background: rgba(30, 41, 59, 0.8);
            color: #e0e7ff;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:hover {
            border-color: rgba(96, 165, 250, 0.6);
        }

        select:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
        }

        .recording-area {
            text-align: center;
            padding: 40px;
            margin: 30px 0;
        }

        .mic-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
            position: relative;
        }

        .mic-button:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 32px rgba(59, 130, 246, 0.6);
        }

        .mic-button:active {
            transform: scale(0.95);
        }

        .mic-button.recording {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 8px 24px rgba(239, 68, 68, 0.4);
            }
            50% {
                box-shadow: 0 12px 40px rgba(239, 68, 68, 0.8);
            }
        }

        .mic-icon {
            width: 50px;
            height: 50px;
            fill: white;
        }

        .status-text {
            margin-top: 20px;
            font-size: 1.1em;
            color: #94a3b8;
            font-weight: 500;
        }

        .status-text.recording {
            color: #fca5a5;
        }

        .results-section {
            margin-top: 30px;
            display: none;
        }

        .results-section.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-box {
            background: rgba(30, 41, 59, 0.6);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #60a5fa;
        }

        .result-label {
            font-size: 0.85em;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .result-text {
            font-size: 1.1em;
            color: #e0e7ff;
            line-height: 1.6;
        }

        .audio-player {
            margin-top: 20px;
            width: 100%;
        }

        audio {
            width: 100%;
            border-radius: 10px;
            background: rgba(30, 41, 59, 0.8);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
            padding: 15px 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #60a5fa;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid rgba(96, 165, 250, 0.3);
            border-top: 3px solid #60a5fa;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .language-selector {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
            }

            .main-card {
                padding: 25px;
            }

            .mic-button {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>LinguaFlow</h1>
            <p class="subtitle">Real-time Speech Translation</p>
        </header>

        <div class="main-card">
            <div class="language-selector">
                <div class="select-group">
                    <label for="source-language">Source Language</label>
                    <select id="source-language">
                        <option value="auto">Auto-detect</option>
                        {% for language in languages %}
                        <option value="{{ language }}">{{ language.capitalize() }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="select-group">
                    <label for="target-language">Target Language</label>
                    <select id="target-language">
                        {% for language in languages %}
                        <option value="{{ language }}" {% if language == 'english' %}selected{% endif %}>
                            {{ language.capitalize() }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="recording-area">
                <button id="mic-button" class="mic-button" onclick="toggleRecording()">
                    <svg class="mic-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>
                <p id="status-text" class="status-text">Click to start recording</p>
            </div>

            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Processing your speech...</p>
            </div>

            <div id="error-message" class="error-message"></div>

            <div id="results-section" class="results-section">
                <div class="result-box">
                    <div class="result-label">Recognized (<span id="detected-lang"></span>)</div>
                    <div id="recognized-text" class="result-text"></div>
                </div>

                <div class="result-box">
                    <div class="result-label">Translation (<span id="target-lang"></span>)</div>
                    <div id="translated-text" class="result-text"></div>
                </div>

                <div class="audio-player">
                    <audio id="audio-output" controls></audio>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>LinguaFlow &copy; 2024 | Real-time Speech Translation System</p>
    </footer>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        async function toggleRecording() {
            if (!isRecording) {
                await startRecording();
            } else {
                stopRecording();
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    await processAudio(audioBlob);
                    
                    // Stop all tracks
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;

                // Update UI
                document.getElementById('mic-button').classList.add('recording');
                document.getElementById('status-text').textContent = 'Recording... Click to stop';
                document.getElementById('status-text').classList.add('recording');
                document.getElementById('error-message').classList.remove('show');
                document.getElementById('results-section').classList.remove('show');

            } catch (error) {
                showError('Microphone access denied. Please allow microphone permissions.');
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;

                // Update UI
                document.getElementById('mic-button').classList.remove('recording');
                document.getElementById('status-text').textContent = 'Processing...';
                document.getElementById('status-text').classList.remove('recording');
            }
        }

        async function processAudio(audioBlob) {
            const formData = new FormData();
            formData.append('audio', audioBlob, 'recording.mp3');
            formData.append('source_language', document.getElementById('source-language').value);
            formData.append('target_language', document.getElementById('target-language').value);

            // Show loading
            document.getElementById('loading').classList.add('show');

            try {
                const response = await fetch('/process_audio', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                // Hide loading
                document.getElementById('loading').classList.remove('show');

                if (response.ok && data.success) {
                    displayResults(data);
                    document.getElementById('status-text').textContent = 'Click to start recording';
                } else {
                    showError(data.error || 'An error occurred during processing');
                    document.getElementById('status-text').textContent = 'Click to try again';
                }

            } catch (error) {
                document.getElementById('loading').classList.remove('show');
                showError('Network error. Please check your connection and try again.');
                document.getElementById('status-text').textContent = 'Click to try again';
            }
        }

        function displayResults(data) {
            document.getElementById('detected-lang').textContent = data.source_language.toUpperCase();
            document.getElementById('target-lang').textContent = data.target_language.toUpperCase();
            document.getElementById('recognized-text').textContent = data.recognized_text;
            document.getElementById('translated-text').textContent = data.translated_text;

            // Set audio source
            const audioElement = document.getElementById('audio-output');
            audioElement.src = 'data:audio/mp3;base64,' + data.audio;

            // Show results
            document.getElementById('results-section').classList.add('show');
        }

        function showError(message) {
            const errorElement = document.getElementById('error-message');
            errorElement.textContent = message;
            errorElement.classList.add('show');
        }
    </script>
</body>
</html>
