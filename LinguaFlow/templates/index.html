<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaFlow - Real-time Translation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --accent: #60a5fa;
            --accent-2: #a78bfa;
            --info: #60a5fa;
            --degraded: #fbbf24;
            --card: rgba(13, 27, 42, 0.7);
            --panel: rgba(30, 41, 59, 0.6);
            --text: #e0e7ff;
            --muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1929 0%, #1a2942 50%, #2d4263 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
            width: 100%;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(13, 27, 42, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 3em;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 1.1em;
        }

        .main-card {
            background: var(--card);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(96, 165, 250, 0.2);
        }

        .language-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .select-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-weight: 600;
            color: #cbd5e1;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select {
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid rgba(96, 165, 250, 0.3);
            background: rgba(30, 41, 59, 0.8);
            color: var(--text);
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:hover { border-color: rgba(96, 165, 250, 0.6); }

        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
        }

        .recording-area {
            text-align: center;
            padding: 40px;
            margin: 30px 0;
        }

        .mic-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
            position: relative;
        }

        .mic-button:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 32px rgba(59, 130, 246, 0.6);
        }

        .mic-button:active { transform: scale(0.95); }

        /* "Live" state — magenta, deliberately not red */
        .mic-button.recording {
            background: linear-gradient(135deg, #d946ef 0%, #a21caf 100%);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 8px 24px rgba(217, 70, 239, 0.45); }
            50%      { box-shadow: 0 12px 40px rgba(217, 70, 239, 0.85); }
        }

        .mic-button:disabled { opacity: 0.6; cursor: default; }

        .mic-icon { width: 50px; height: 50px; fill: white; }

        .status-text {
            margin-top: 20px;
            font-size: 1.1em;
            color: var(--muted);
            font-weight: 500;
        }

        .status-text.recording { color: #f0abfc; }

        .results-section { margin-top: 30px; display: none; }

        .results-section.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .result-box {
            background: var(--panel);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent);
        }

        .result-box.pending { border-left-color: var(--degraded); }

        .result-label {
            font-size: 0.85em;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .result-text { font-size: 1.1em; color: var(--text); line-height: 1.6; }
        .result-text.muted { color: var(--muted); font-style: italic; }

        .engine-tag {
            display: inline-block;
            font-size: 0.7em;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--muted);
            border: 1px solid rgba(148, 163, 184, 0.35);
            border-radius: 999px;
            padding: 2px 8px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .audio-player { margin-top: 20px; width: 100%; }

        audio {
            width: 100%;
            border-radius: 10px;
            background: rgba(30, 41, 59, 0.8);
        }

        .audio-unavailable {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 10px;
            background: var(--panel);
            color: var(--muted);
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .audio-unavailable svg { width: 18px; height: 18px; fill: var(--muted); flex-shrink: 0; }

        /* ── Toast / notice — glassy, matches the card. Never red. ── */
        .toast-wrap {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: min(92vw, 460px);
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            background: rgba(13, 27, 42, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(96, 165, 250, 0.35);
            border-left: 4px solid var(--info);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text);
            font-size: 0.98em;
            line-height: 1.45;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: toastIn 0.35s ease;
        }

        .toast.degraded { border-left-color: var(--degraded); border-color: rgba(251, 191, 36, 0.35); }
        .toast .toast-icon { width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px; }
        .toast.info .toast-icon { fill: var(--info); }
        .toast.degraded .toast-icon { fill: var(--degraded); }
        .toast .toast-msg { flex: 1; }

        .toast .toast-close {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 1.2em;
            line-height: 1;
            cursor: pointer;
            padding: 0 2px;
        }

        .toast.hide { animation: toastOut 0.3s ease forwards; }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0); }
            to   { opacity: 0; transform: translateY(16px); }
        }

        .loading { display: none; text-align: center; margin-top: 20px; color: var(--accent); }
        .loading.show { display: block; }

        .spinner {
            border: 3px solid rgba(96, 165, 250, 0.3);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        footer { text-align: center; padding: 20px; color: #64748b; font-size: 0.9em; }

        @media (max-width: 768px) {
            .language-selector { grid-template-columns: 1fr; }
            h1 { font-size: 2em; }
            .main-card { padding: 25px; }
            .mic-button { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>LinguaFlow</h1>
            <p class="subtitle">Real-time Speech Translation</p>
        </header>

        <div class="main-card">
            <div class="language-selector">
                <div class="select-group">
                    <label for="source-language">Source Language</label>
                    <select id="source-language">
                        <option value="auto">Auto-detect</option>
                        {% for language in languages %}
                        <option value="{{ language }}">{{ language.capitalize() }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="select-group">
                    <label for="target-language">Target Language</label>
                    <select id="target-language">
                        {% for language in languages %}
                        <option value="{{ language }}" {% if language == 'english' %}selected{% endif %}>
                            {{ language.capitalize() }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="recording-area">
                <button id="mic-button" class="mic-button" onclick="toggleRecording()">
                    <svg class="mic-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>
                <p id="status-text" class="status-text">Click to start recording</p>
            </div>

            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Processing your speech...</p>
            </div>

            <div id="results-section" class="results-section">
                <div class="result-box">
                    <div class="result-label">Recognized (<span id="detected-lang"></span>)</div>
                    <div id="recognized-text" class="result-text"></div>
                </div>

                <div class="result-box" id="translation-box">
                    <div class="result-label">
                        Translation (<span id="target-lang"></span>)<span id="translation-engine" class="engine-tag" hidden></span>
                    </div>
                    <div id="translated-text" class="result-text"></div>
                </div>

                <div class="audio-player" id="audio-wrap">
                    <audio id="audio-output" controls></audio>
                </div>

                <div class="audio-unavailable" id="audio-unavailable" hidden>
                    <svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                    <span id="audio-unavailable-text">Audio isn't available right now.</span>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>LinguaFlow &copy; 2024 | Real-time Speech Translation System</p>
    </footer>

    <div class="toast-wrap" id="toast-wrap"></div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        const $ = (id) => document.getElementById(id);

        async function toggleRecording() {
            if (!isRecording) { await startRecording(); }
            else { stopRecording(); }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const mime = mediaRecorder.mimeType || 'audio/webm';
                    const audioBlob = new Blob(audioChunks, { type: mime });
                    await processAudio(audioBlob);
                    stream.getTracks().forEach(t => t.stop());
                };

                mediaRecorder.start();
                isRecording = true;

                $('mic-button').classList.add('recording');
                $('status-text').textContent = 'Recording... Click to stop';
                $('status-text').classList.add('recording');
                $('results-section').classList.remove('show');
            } catch (error) {
                showToast('info', 'Microphone access is blocked. Allow microphone permission in your browser, then try again.');
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                $('mic-button').classList.remove('recording');
                $('status-text').textContent = 'Processing...';
                $('status-text').classList.remove('recording');
            }
        }

        async function processAudio(audioBlob) {
            const formData = new FormData();
            formData.append('audio', audioBlob, 'recording.webm');
            formData.append('source_language', $('source-language').value);
            formData.append('target_language', $('target-language').value);

            $('loading').classList.add('show');
            $('mic-button').disabled = true;

            try {
                const response = await fetch('/process_audio', { method: 'POST', body: formData });
                let data;
                try { data = await response.json(); }
                catch (_) { data = { status: 'unavailable', notice: 'Something went wrong on the server. Please try again shortly.' }; }
                handleResponse(data);
            } catch (error) {
                showToast('info', 'Connection issue — check your network and try again.');
                $('status-text').textContent = 'Click to try again';
            } finally {
                $('loading').classList.remove('show');
                $('mic-button').disabled = false;
            }
        }

        function handleResponse(data) {
            const status = data.status || 'unavailable';

            // Cases where there's nothing worth showing in the results panel.
            if (status === 'no_speech' || status === 'speech_down' ||
                (status === 'unavailable' && !data.recognized_text)) {
                $('results-section').classList.remove('show');
                showToast(status === 'no_speech' ? 'info' : 'info',
                          data.notice || 'Please try again.');
                $('status-text').textContent = 'Click to try again';
                return;
            }

            displayResults(data);

            if (data.notice) {
                const kind = (status === 'degraded_audio') ? 'degraded' : 'info';
                showToast(kind, data.notice);
            }
            $('status-text').textContent = 'Click to start recording';
        }

        function displayResults(data) {
            $('detected-lang').textContent = (data.source_language || '').toUpperCase();
            $('target-lang').textContent = (data.target_language || '').toUpperCase();
            $('recognized-text').textContent = data.recognized_text || '—';

            // Translation
            const tBox = $('translation-box');
            const tText = $('translated-text');
            const tEngine = $('translation-engine');
            if (data.translated_text) {
                tText.textContent = data.translated_text;
                tText.classList.remove('muted');
                tBox.classList.remove('pending');
                if (data.translation_engine && data.translation_engine !== 'passthrough') {
                    tEngine.textContent = 'via ' + data.translation_engine;
                    tEngine.hidden = false;
                } else {
                    tEngine.hidden = true;
                }
            } else {
                tText.textContent = 'Not available right now — please try again shortly.';
                tText.classList.add('muted');
                tBox.classList.add('pending');
                tEngine.hidden = true;
            }

            // Audio
            const audioWrap = $('audio-wrap');
            const audioEl = $('audio-output');
            const audioMissing = $('audio-unavailable');
            const audioMissingText = $('audio-unavailable-text');

            if (data.audio) {
                const mime = data.audio_mime || 'audio/mpeg';
                audioEl.src = `data:${mime};base64,${data.audio}`;
                audioWrap.hidden = false;
                audioMissing.hidden = true;
            } else {
                audioEl.removeAttribute('src');
                audioWrap.hidden = true;
                audioMissing.hidden = false;
                audioMissingText.textContent = data.translated_text
                    ? "Audio isn't available for this language right now — the translation above is ready."
                    : "Audio isn't available right now.";
            }

            $('results-section').classList.add('show');
        }

        // ── Toasts ───────────────────────────────────────────────────────────
        const ICONS = {
            info: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>',
            degraded: '<path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>'
        };

        function showToast(kind, message, timeout = 6000) {
            const wrap = $('toast-wrap');
            const el = document.createElement('div');
            el.className = `toast ${kind === 'degraded' ? 'degraded' : 'info'}`;
            el.innerHTML = `
                <svg class="toast-icon" viewBox="0 0 24 24">${ICONS[kind] || ICONS.info}</svg>
                <div class="toast-msg"></div>
                <button class="toast-close" aria-label="Dismiss">&times;</button>`;
            el.querySelector('.toast-msg').textContent = message;

            const dismiss = () => {
                el.classList.add('hide');
                setTimeout(() => el.remove(), 300);
            };
            el.querySelector('.toast-close').addEventListener('click', dismiss);
            wrap.appendChild(el);
            if (timeout) setTimeout(dismiss, timeout);
        }
    </script>
</body>
</html>
